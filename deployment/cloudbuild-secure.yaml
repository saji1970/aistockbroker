steps:
  # Build secure backend
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-f'
      - 'Dockerfile.secure-backend'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-stock-trading-secure-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-stock-trading-secure-backend:latest'
      - '--build-arg'
      - 'BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)'
      - '--build-arg'
      - 'VERSION=$COMMIT_SHA'
      - '.'

  # Push secure backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-stock-trading-secure-backend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-stock-trading-secure-backend:latest']

  # Deploy secure backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-stock-trading-secure-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ai-stock-trading-secure-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '100'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'FLASK_ENV=production,SECRET_KEY=production-secret-key-change-this,JWT_SECRET_KEY=production-jwt-secret-change-this'
      - '--service-account'
      - 'ai-stock-trading-backend@$PROJECT_ID.iam.gserviceaccount.com'

  # Set IAM policy for secure backend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'beta'
      - 'run'
      - 'services'
      - 'add-iam-policy-binding'
      - 'ai-stock-trading-secure-backend'
      - '--region'
      - 'us-central1'
      - '--member'
      - 'allUsers'
      - '--role'
      - 'roles/run.invoker'

  # Security scanning (optional)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'container'
      - 'images'
      - 'scan'
      - 'gcr.io/$PROJECT_ID/ai-stock-trading-secure-backend:$COMMIT_SHA'

  # Build secure frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-f'
      - 'frontend/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-stock-trading-secure-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-stock-trading-secure-frontend:latest'
      - '--build-arg'
      - 'REACT_APP_API_URL=https://ai-stock-trading-secure-backend-$PROJECT_ID.us-central1.run.app'
      - '.'

  # Push secure frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-stock-trading-secure-frontend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-stock-trading-secure-frontend:latest']

  # Deploy secure frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-stock-trading-secure-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ai-stock-trading-secure-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'

  # Set IAM policy for secure frontend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'beta'
      - 'run'
      - 'services'
      - 'add-iam-policy-binding'
      - 'ai-stock-trading-secure-frontend'
      - '--region'
      - 'us-central1'
      - '--member'
      - 'allUsers'
      - '--role'
      - 'roles/run.invoker'

  # Security scanning for frontend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'container'
      - 'images'
      - 'scan'
      - 'gcr.io/$PROJECT_ID/ai-stock-trading-secure-frontend:$COMMIT_SHA'

  # Create security monitoring dashboard
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'monitoring'
      - 'dashboards'
      - 'create'
      - '--config-from-file'
      - 'deployment/security-dashboard.yaml'

  # Set up security alerts
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'alpha'
      - 'monitoring'
      - 'policies'
      - 'create'
      - '--policy-from-file'
      - 'deployment/security-alerts.yaml'

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
